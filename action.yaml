name: "Gemini Actions"
description: "A collection of GitHub Actions powered by Google Gemini that automate repository workflows"
author: "dortort"

inputs:
  action:
    description: "This is a meta-package. Use the individual actions in subdirectories (e.g. dortort/gemini-actions/pr-review@v0)."
    required: false

branding:
  icon: "zap"
  color: "blue"

runs:
  using: "composite"
  steps:
    - name: Info
      shell: bash
      run: |
        echo "::notice::This is a meta-package. Use individual actions instead:"
        echo "::notice::  - dortort/gemini-actions/pr-review@v0"
        echo "::notice::  - dortort/gemini-actions/pr-from-issue@v0"
        echo "::notice::  - dortort/gemini-actions/dependency-impact@v0"
        echo "::notice::  - dortort/gemini-actions/test-failure-diagnosis@v0"
        echo "::notice::  - dortort/gemini-actions/datadog-responder@v0"
        echo "::notice::  - dortort/gemini-actions/repo-qa@v0"
